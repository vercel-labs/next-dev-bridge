name: Test

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test:unit

      - name: Build
        run: bun run build

  integration:
    name: Next.js ${{ matrix.next-version }} integration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        next-version:
          - '16.2'
          - '16.3'
          - '16.4.0-canary.30'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Next.js ${{ matrix.next-version }}
        run: bun add --dev --minimum-release-age 0 next@${{ matrix.next-version }}

      - name: Run integration test
        run: bun run test:integration
        env:
          __NEXT_EXPOSE_RUNTIME_ERRORS_TO_HMR: ${{ matrix.next-version == '16.4.0-canary.30' && '1' || '' }}
